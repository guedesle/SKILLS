name: Package ChatGPT skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "registry.json"
      - "requirements-dev.txt"
      - "scripts/package_chatgpt_skills.py"
      - "scripts/skill_validation.py"
      - ".github/workflows/package-chatgpt-skills.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate ChatGPT skill bundles
        run: python scripts/package_chatgpt_skills.py --check
      - name: Build ChatGPT skill bundles
        run: python scripts/package_chatgpt_skills.py --output /tmp/chatgpt-skills
      - name: Smoke test generated bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          root = Path('/tmp/chatgpt-skills')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          bundles = manifest.get('skills', [])
          if not bundles:
              raise SystemExit('manifest sem skills')
          for item in bundles:
              bundle = root / item['bundle']
              if not bundle.is_file():
                  raise SystemExit(f'bundle ausente: {bundle}')
              with zipfile.ZipFile(bundle) as archive:
                  names = archive.namelist()
                  if 'SKILL.md' not in names:
                      raise SystemExit(f'SKILL.md ausente na raiz: {bundle.name}')
                  if any(name.startswith('/') or '..' in Path(name).parts for name in names):
                      raise SystemExit(f'path inseguro no bundle: {bundle.name}')
          print(f'ChatGPT bundle smoke PASS: {len(bundles)} skills')
          PY
      - name: Upload ChatGPT skill bundles
        uses: actions/upload-artifact@v4
        with:
          name: guedesle-chatgpt-skills
          path: /tmp/chatgpt-skills
          retention-days: 30
