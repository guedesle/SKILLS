name: Sync central skills

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "registry.json"
      - "plugin-catalog.json"
      - "README.md"
      - "general-skills-status.md"
      - "AGENTS.md"
      - "scripts/sync_skills.py"
      - "scripts/skill_validation.py"
      - "scripts/validate_skill_evals.py"
      - "scripts/audit_skill_portability.py"
      - "scripts/sync_consumer.py"
      - "scripts/bootstrap_consumers.py"
      - "scripts/package_chatgpt_skills.py"
      - "scripts/package_plugins.py"
      - "templates/sync-central-skills.yml"
      - "CHATGPT.md"
      - ".github/workflows/mirror-consumer.yml"
      - ".github/workflows/sync-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "registry.json"
      - "plugin-catalog.json"
      - "README.md"
      - "general-skills-status.md"
      - "AGENTS.md"
      - "scripts/sync_skills.py"
      - "scripts/skill_validation.py"
      - "scripts/validate_skill_evals.py"
      - "scripts/audit_skill_portability.py"
      - "scripts/sync_consumer.py"
      - "scripts/bootstrap_consumers.py"
      - "scripts/package_chatgpt_skills.py"
      - "scripts/package_plugins.py"
      - "templates/sync-central-skills.yml"
      - "CHATGPT.md"
      - ".github/workflows/mirror-consumer.yml"
      - ".github/workflows/sync-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate registry and catalog
        run: python scripts/sync_skills.py --check
      - name: Validate skill evals
        run: python scripts/validate_skill_evals.py
      - name: Validate ChatGPT packages
        run: python scripts/package_chatgpt_skills.py --check
      - name: Validate skills-only plugin catalog
        run: python scripts/package_plugins.py --check
      - name: Compile utilities
        run: python -m py_compile scripts/*.py
      - name: Smoke test ChatGPT bundles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_chatgpt_skills.py --output /tmp/chatgpt-skills
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          root = Path('/tmp/chatgpt-skills')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          bundles = manifest['skills']
          if not bundles:
              raise SystemExit('manifest sem skills')
          for item in bundles:
              bundle = root / item['bundle']
              if not bundle.is_file():
                  raise SystemExit(f'bundle ausente: {bundle}')
              with zipfile.ZipFile(bundle) as archive:
                  names = archive.namelist()
                  if 'SKILL.md' not in names:
                      raise SystemExit(f'SKILL.md ausente na raiz: {bundle.name}')
                  if any(name.startswith('/') or '..' in Path(name).parts for name in names):
                      raise SystemExit(f'path inseguro no bundle: {bundle.name}')
          print(f'ChatGPT bundle smoke PASS: {len(bundles)} skills')
          PY
      - name: Build and smoke test skills-only plugin
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_plugins.py --output /tmp/skills-plugins
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          root = Path('/tmp/skills-plugins')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          plugins = manifest['plugins']
          if len(plugins) != 1:
              raise SystemExit(f'esperado 1 plugin, encontrado {len(plugins)}')
          item = plugins[0]
          plugin_root = root / 'marketplace' / 'plugins' / item['name']
          plugin_manifest = json.loads((plugin_root / '.codex-plugin' / 'plugin.json').read_text(encoding='utf-8'))
          if plugin_manifest.get('skills') != './skills/':
              raise SystemExit('manifest do plugin não aponta para ./skills/')
          if len(item['skills']) != 17:
              raise SystemExit(f'esperadas 17 skills no plugin, encontradas {len(item["skills"])}')
          for skill in item['skills']:
              if not (plugin_root / 'skills' / skill['name'] / 'SKILL.md').is_file():
                  raise SystemExit(f'skill ausente no plugin: {skill["name"]}')
          marketplace = json.loads((root / 'marketplace' / '.agents' / 'plugins' / 'marketplace.json').read_text(encoding='utf-8'))
          if marketplace['plugins'][0]['source']['path'] != f'./plugins/{item["name"]}':
              raise SystemExit('marketplace path inválido')
          archive = root / item['archive']
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              if '.codex-plugin/plugin.json' not in names:
                  raise SystemExit('plugin.json ausente no ZIP')
              if any(name.startswith('/') or '..' in Path(name).parts for name in names):
                  raise SystemExit('path inseguro no ZIP do plugin')
          print(f'Skills-only plugin smoke PASS: {item["name"]} com {len(item["skills"])} skills')
          PY
      - name: Upload skills-only plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: guedesle-governed-workflow
          path: /tmp/skills-plugins
          include-hidden-files: true
          retention-days: 14
      - name: Smoke test generic pull resolver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/skills-consumer
          python scripts/sync_consumer.py \
            --central-root . \
            --repository guedesle/download-edicoes-doe \
            --branch main \
            --target-root /tmp/skills-consumer \
            --paths-output /tmp/skills-managed-paths.txt
          test -f /tmp/skills-consumer/.agents/skills/write-technical-content/SKILL.md
          test -f /tmp/skills-consumer/.agents/skills/review-editorial-quality/SKILL.md
          test "$(wc -l < /tmp/skills-managed-paths.txt)" -eq 2

  sync:
    needs: validate
    if: ${{ github.event_name == 'push' && vars.SKILLS_AUTO_SYNC == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Configure Git identity
        run: |
          git config --global user.name "skills-sync-bot"
          git config --global user.email "skills-sync-bot@users.noreply.github.com"
      - name: Sync registered push mirrors
        env:
          GH_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
        run: python scripts/sync_skills.py --apply
